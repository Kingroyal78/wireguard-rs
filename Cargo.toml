[package]
name = "defguard_wireguard_rs"
version = "0.10.0"
edition = "2024"
rust-version = "1.87"
autobins = false
description = "A unified multi-platform high-level API for managing WireGuard interfaces"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/DefGuard/wireguard-rs"
repository = "https://github.com/DefGuard/wireguard-rs"
keywords = ["wireguard", "network", "vpn"]
categories = ["network-programming"]

[dependencies]
anyhow = { version = "1.0", optional = true }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"], optional = true }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
toml = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
x25519-dalek = { version = "2.0", features = ["getrandom", "static_secrets"] }

[dev-dependencies]
env_logger = "0.11"
serde_test = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
defguard_boringtun = { version = "0.6", default-features = false, features = [
    "device",
]}
libc = { version = "0.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
ipnet = "2.11"
windows = { version = "0.62", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
] }
wireguard-nt = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.8"
netlink-packet-generic = "0.4"
netlink-packet-route = "0.30"
netlink-packet-utils = "0.6"
netlink-packet-wireguard = "0.4"
netlink-sys = "0.8"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
regex = "1.12"

[features]
default = ["serde"]
check_dependencies = []
serde = ["dep:serde"]
v2board-daemon = [
    "serde",
    "dep:anyhow",
    "dep:clap",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "v2board-wireguard"
path = "src/bin/v2board-wireguard.rs"
required-features = ["v2board-daemon"]

[profile.release]
codegen-units = 1
panic = "abort"
lto = "thin"
strip = "symbols"
